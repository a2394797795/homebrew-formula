name: Update zotero-pdf2zh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

env:
  UPSTREAM_REPO: guaguastandup/zotero-pdf2zh
  KEEPALIVE_FILE: .github/workflow-keepalive

concurrency:
  group: update-zotero-pdf2zh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prune merged automation branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          default_branch='${{ github.event.repository.default_branch }}'
          git fetch origin "$default_branch" '+refs/heads/bump-zotero-pdf2zh-*:+refs/remotes/origin/bump-zotero-pdf2zh-*' || true

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/bump-zotero-pdf2zh-*' | sed 's#^origin/##'
          )

          if [ "${#branches[@]}" -eq 0 ]; then
            echo 'No remote automation branches to prune.'
            exit 0
          fi

          for branch in "${branches[@]}"; do
            [ -n "$branch" ] || continue
            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" "refs/remotes/origin/$default_branch"; then
              echo "Keeping $branch (not merged into $default_branch)."
              continue
            fi

            open_count="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${branch}" --jq 'length')"
            if [ "$open_count" != '0' ]; then
              echo "Keeping $branch (open PR exists)."
              continue
            fi

            echo "Deleting merged automation branch $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
          done

      - name: Update formula from latest upstream release
        id: update_formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update_formula.sh

      - name: Show formula diff
        if: steps.update_formula.outputs.update_needed == 'true'
        run: git diff -- Formula/zotero-pdf2zh.rb

      - name: Set up Homebrew
        if: steps.update_formula.outputs.update_needed == 'true'
        uses: Homebrew/actions/setup-homebrew@master

      - name: Validate updated formula
        if: steps.update_formula.outputs.update_needed == 'true'
        run: ./scripts/smoke_test.sh

      - name: Create pull request
        if: steps.update_formula.outputs.update_needed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.update_formula.outputs.branch_name }}
          delete-branch: true
          add-paths: |
            Formula/zotero-pdf2zh.rb
          title: Update zotero-pdf2zh to ${{ steps.update_formula.outputs.latest_version }}
          commit-message: Update zotero-pdf2zh to ${{ steps.update_formula.outputs.latest_version }}
          body: |
            Automated update of `Formula/zotero-pdf2zh.rb` based on the latest upstream release.
            - Upstream: https://github.com/${{ env.UPSTREAM_REPO }}
            - Asset: ${{ steps.update_formula.outputs.asset_url }}
            - SHA256: `${{ steps.update_formula.outputs.sha256 }}`
            - Validation: `./scripts/smoke_test.sh`

      - name: Enable auto-merge (squash)
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-url }}"

      - name: Keep scheduled workflows active
        if: github.event_name == 'schedule' && steps.update_formula.outputs.update_needed != 'true'
        run: |
          set -euo pipefail
          default_branch='${{ github.event.repository.default_branch }}'
          last_commit_ts="$(git log -1 --format=%ct "origin/$default_branch")"
          now="$(date +%s)"
          age_days=$(( (now - last_commit_ts) / 86400 ))
          echo "Latest default-branch activity is ${age_days} day(s) old."

          if [ "$age_days" -lt 45 ]; then
            echo 'Recent repository activity detected; keepalive not needed.'
            exit 0
          fi

          mkdir -p "$(dirname "$KEEPALIVE_FILE")"
          printf 'Last automated keepalive: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >"$KEEPALIVE_FILE"

          if git diff --quiet -- "$KEEPALIVE_FILE"; then
            echo 'Keepalive file already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$KEEPALIVE_FILE"
          git commit -m 'chore: keep scheduled workflows active'
          git push origin "HEAD:${default_branch}"
