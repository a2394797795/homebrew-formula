name: Update zotero-pdf2zh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

env:
  UPSTREAM_REPO: guaguastandup/zotero-pdf2zh
  KEEPALIVE_FILE: .github/workflow-keepalive
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-zotero-pdf2zh
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test maintenance scripts
        run: ./tests/keep_workflows_active_test.sh

      - name: Prune merged automation branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          default_branch='${{ github.event.repository.default_branch }}'
          git fetch origin "$default_branch" || true
          git fetch origin '+refs/heads/bump-zotero-pdf2zh-*:refs/remotes/origin/bump-zotero-pdf2zh-*' || true

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/bump-zotero-pdf2zh-*' | sed 's#^origin/##'
          )

          if [ "${#branches[@]}" -eq 0 ]; then
            echo 'No remote automation branches to prune.'
            exit 0
          fi

          for branch in "${branches[@]}"; do
            [ -n "$branch" ] || continue
            open_count="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${branch}" --jq 'length')"
            if [ "$open_count" != '0' ]; then
              echo "Keeping $branch (open PR exists)."
              continue
            fi

            closed_count="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&head=${GITHUB_REPOSITORY_OWNER}:${branch}" --jq 'length')"
            if [ "$closed_count" != '0' ]; then
              echo "Deleting $branch (PR already closed)."
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
              continue
            fi

            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" "refs/remotes/origin/$default_branch"; then
              echo "Keeping $branch (not merged into $default_branch and no closed PR)."
              continue
            fi

            echo "Deleting merged automation branch $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
          done

      - name: Update formula from latest upstream release
        id: update_formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update_formula.sh

      - name: Install Homebrew
        if: steps.update_formula.outputs.update_needed == 'true'
        env:
          NONINTERACTIVE: 1
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          {
            echo "PATH=$HOMEBREW_PREFIX/bin:$HOMEBREW_PREFIX/sbin:$PATH"
            echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX"
            echo "HOMEBREW_CELLAR=$HOMEBREW_CELLAR"
            echo "HOMEBREW_REPOSITORY=$HOMEBREW_REPOSITORY"
          } >> "$GITHUB_ENV"
          {
            echo "$HOMEBREW_PREFIX/bin"
            echo "$HOMEBREW_PREFIX/sbin"
          } >> "$GITHUB_PATH"
          brew --version

      - name: Show formula diff
        if: steps.update_formula.outputs.update_needed == 'true'
        run: git diff -- Formula/zotero-pdf2zh.rb

      - name: Validate updated formula
        if: steps.update_formula.outputs.update_needed == 'true'
        run: ./scripts/smoke_test.sh

      - name: Create pull request
        if: steps.update_formula.outputs.update_needed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ steps.update_formula.outputs.branch_name }}
          delete-branch: true
          add-paths: |
            Formula/zotero-pdf2zh.rb
          title: Update zotero-pdf2zh to ${{ steps.update_formula.outputs.latest_version }}
          commit-message: Update zotero-pdf2zh to ${{ steps.update_formula.outputs.latest_version }}
          body: |
            Automated update of `Formula/zotero-pdf2zh.rb` based on the latest upstream release.
            - Upstream: https://github.com/${{ env.UPSTREAM_REPO }}
            - Asset: ${{ steps.update_formula.outputs.asset_url }}
            - SHA256: `${{ steps.update_formula.outputs.sha256 }}`
            - Validation: `./scripts/smoke_test.sh`

      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ steps.cpr.outputs.pull-request-url }}"
          base_branch="$(gh pr view "$pr" --json baseRefName --jq '.baseRefName')"
          state="$(gh pr view "$pr" --json mergeStateStatus --jq '.mergeStateStatus')"

          if gh api "repos/${GITHUB_REPOSITORY}/branches/${base_branch}/protection" >/dev/null 2>&1; then
            branch_protected='true'
          else
            branch_protected='false'
          fi

          echo "mergeStateStatus=${state}"
          echo "branchProtected=${branch_protected}"

          if [ "$branch_protected" = 'true' ]; then
            if [ "$state" = "CLEAN" ]; then
              gh pr merge --squash --delete-branch "$pr"
            else
              gh pr merge --auto --squash "$pr"
            fi
          else
            attempts=0
            max_attempts=6

            until gh pr merge --squash --delete-branch "$pr"; do
              attempts=$((attempts + 1))
              state="$(gh pr view "$pr" --json mergeStateStatus --jq '.mergeStateStatus')"

              if [ "$attempts" -ge "$max_attempts" ]; then
                echo "Direct merge failed after ${attempts} attempts (mergeStateStatus=${state})."
                exit 1
              fi

              echo "Direct merge not ready yet (attempt ${attempts}/${max_attempts}, mergeStateStatus=${state}); retrying..."
              sleep 5
            done
          fi

          merged_at="$(gh pr view "$pr" --json mergedAt --jq '.mergedAt // empty')"
          if [ -n "$merged_at" ]; then
            branch="$(gh pr view "$pr" --json headRefName --jq '.headRefName')"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          fi

  keepalive:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare keepalive commit
        id: keepalive
        env:
          KEEPALIVE_AFTER_DAYS: 45
          KEEPALIVE_BASE_REF: HEAD
        run: ./scripts/keep_workflows_active.sh

      - name: Push keepalive commit
        if: steps.keepalive.outputs.commit_created == 'true'
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}"
