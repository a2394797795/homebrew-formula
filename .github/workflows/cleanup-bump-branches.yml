name: Cleanup bump branches

on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'bump-zotero-pdf2zh-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete merged automation branch if it still exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch='${{ github.event.pull_request.head.ref }}'
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
